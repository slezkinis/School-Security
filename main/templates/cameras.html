{% extends 'base.html' %}
{% load static %}

{% block title %}Камеры{% endblock %}

{% block content %}
<h2 class="text-center mb-4">Прямой эфир</h2>

<div class="row g-4">
  <div class="col-lg-6">
    <div class="group">
      <h4 class="text-center mb-3">Вход</h4>
      <div class="row g-3">
        {% for camera in enter_cameras %}
        <div class="col-6">
          <div class="ratio ratio-16x9 bg-dark rounded">
            <img src="/media/not_found.png">
          </div>
        </div>
        {% endfor %}
      </div>
    </div>
  </div>

  <div class="col-lg-6">
    <div class="group">
      <h4 class="text-center mb-3">Выход</h4>
      <div class="row g-3">
        {% for camera in exit_cameras %}
        <div class="col-6">
          <div class="ratio ratio-16x9 bg-dark rounded">
            <img src="/media/not_found.png">
          </div>
        </div>
        {% endfor %}
      </div>
    </div>
  </div>
</div>

<script src="{% static 'cameras_enter.js' %}"></script>
<script src="{% static 'cameras_exit.js' %}"></script>
{% endblock %}
