<!doctype html>
{% load static %}
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% block title %}{% endblock %}</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Иконки -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Тема -->
  <link rel="stylesheet" href="{% static 'css/theme.css' %}">
</head>
<body>

{% block header_nav %}
<nav class="navbar navbar-expand-lg shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="{% url 'main:index' %}">
      CAPSIS
    </a>

    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link" href="{% url 'main:index' %}">Главная</a>
        </li>

        {% if can_history %}
        <li class="nav-item">
          <a class="nav-link" href="{% url 'main:history' %}">История</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="{% url 'main:cameras' %}">Камеры</a>
        </li>
        {% endif %}
      </ul>

      <div class="d-flex gap-2 align-items-center">
        <a href="{% url 'main:logout' %}" class="btn btn-sm btn-outline-danger">
          Выйти
        </a>
      </div>
    </div>
  </div>
</nav>
{% endblock %}

<main class="container-fluid py-4">
  {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
